<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Rakieta / Sygnał -->
  <g fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Konstrukcja zewnętrzna -->
    <path d="M 200 180 L 250 80 L 300 180 L 250 140 Z" fill="#2563eb" fill-opacity="0.2" />
    <path d="M 180 120 L 320 120" />
    <path d="M 210 60 L 290 180" />
    <path d="M 290 60 L 210 180" />
    <!-- Przekątne skrzydła -->
    <polygon points="180,110 220,70 250,110 210,150" fill="#2563eb" opacity="0.8" />
    <!-- Punkt centralny -->
    <circle cx="250" cy="120" r="10" fill="#2563eb" />
  </g>

  <!-- Napis Ultra -->
  <text x="250" y="290" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="bold" fill="#2563eb" text-anchor="middle">Ultra</text>
</svg>